name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Status check names match job ids — used by branch protection rules
# (.github/rulesets/main.json and .github/rulesets/staging.json)
jobs:
  api-test:
    name: api-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (excludes Stockfish golden)
        run: pytest tests -v -m "not stockfish"

  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:web

  mobile-check:
    name: mobile-check
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Expo app has its own lockfile, outside the npm workspace (React Native's tree stays apart).
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify migrations exist and mention core tables
        shell: bash
        run: |
          test -d supabase/migrations
          sql=$(cat supabase/migrations/*.sql)
          echo "$sql" | grep -q "games"
          echo "$sql" | grep -q "brilliant"
          echo "$sql" | grep -q "style_vectors"

      - name: Verify philosophy docs exist
        shell: bash
        run: |
          test -f docs/PHILOSOPHY.md
          test -f docs/QUALITY_GATES.md
          test -f docs/adr/0001-style-over-accuracy.md

  security-gates:
    name: security-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # No install: the scanner has no dependencies and npm audit reads the lockfile.
      - name: Secret scan + critical npm advisories
        run: npm run ci:security
