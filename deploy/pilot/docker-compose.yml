services:
  api:
    # Production accepts only an immutable registry reference: repository@sha256:digest.
    image: ${PILOT_IMAGE_REF:?set the reviewed immutable image reference}
    pull_policy: always
    restart: unless-stopped
    env_file: /etc/sarce/pilot.env
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 14G
